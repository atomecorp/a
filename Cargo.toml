# The one Rust workspace of atome/eVe: one Cargo.lock, one version of every
# shared dependency, one set of lints and the build profiles of every target.
# Cargo honours profiles and patches only here, never in a member manifest.

[workspace]
resolver = "3"
members = [
    "atome/engines/atome-calendar",
    "atome/engines/atome-dsp",
    "atome/engines/atome-health-ref",
    "atome/engines/atome-instrument",
    "atome/engines/atome-store",
    "atome/engines/audio-engine",
    "atome/engines/audio-kernels",
    "atome/engines/js-values",
    "atome/engines/mix-graph",
    "atome/engines/voice-turns",
    "atome/servers/atome-server",
    "atome/servers/atome-confine",
    "atome/servers/atome-vault",
    "atome/renderers/bevy-core",
    "platforms/web/bevy-renderer",
    "platforms/web/audio-wasm",
    "platforms/web/direct-wasm",
    "platforms/ios/bevy-renderer",
    "platforms/desktop-tauri",
    "platforms/desktop-tauri/vendor/tauri-plugin-billing",
    "platforms/desktop-tauri/vendor/tauri-plugin-health",
    "platforms/desktop-tauri/vendor/tauri-plugin-mobile-host",
    "tools/keychain-converter",
]
# Third-party sources kept verbatim (the wgpu fork, the STT plugin) and copies
# of the tree (temp/, session worktrees) stay outside the workspace.
exclude = [
    "atome/renderers/wgpu-web-external-texture",
    "platforms/desktop-tauri/vendor/tauri-plugin-stt",
    "temp",
    ".claude",
    "node_modules",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
# First-party crates are never published: they ship inside the apps only.
publish = false

[workspace.dependencies]
bevy = { version = "0.19.0", default-features = false }
wgpu = { version = "29.0.4", default-features = false }
# The JS glue in atome/src/wasm is generated by the wasm-bindgen CLI of this
# exact version (platforms/web/wasm_web_build.sh refuses any other).
wasm-bindgen = "=0.2.122"
js-sys = "0.3"
web-sys = "0.3"
serde-wasm-bindgen = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# One audio stack everywhere (user decision, 2026-11-05): Kira 0.12.6 builds on
# cpal 0.18 and Symphonia 0.6, so the engines use those same versions.
kira = { version = "0.12.6", default-features = false }
symphonia = { version = "0.6.1", default-features = false }
cpal = "0.18"
hound = "3"
ringbuf = "0.5.3"
once_cell = "1"
base64 = "0.22"
tempfile = "3"
# The bundled SQLite of every store (atome-store, Tauri, iOS).
rusqlite = { version = "0.31", features = ["bundled"] }
tauri = "2"
tauri-plugin = "2"
# The servers (Tauri's local Axum, atome-server) share one HTTP and WebSocket stack.
axum = "0.8"
tower-http = "0.6"
tokio = "1"
tokio-tungstenite = "0.26"
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
# Bevy systems name their resources and queries without lifetimes (`Res<T>`,
# `Query<&T>`): spelling `'_` on every system parameter adds noise, not safety.
elided_lifetimes_in_paths = "allow"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# Bevy systems receive their parameters by injection: their count and query
# types follow the data they read, as in Bevy's own lint settings.
too_many_arguments = "allow"
type_complexity = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# The WebGPU external-texture fork (browser video frames); its native code is
# the published crate unchanged.
[patch.crates-io]
wgpu = { path = "atome/renderers/wgpu-web-external-texture/wgpu-29.0.4" }
wgpu-types = { path = "atome/renderers/wgpu-web-external-texture/wgpu-types-29.0.4" }

# Desktop and Android (Tauri) use the default release profile.

# The bundled SQLite (C code built by libsqlite3-sys) answers every local query. Left
# unoptimised by the dev profile, it made each `/ws/api` read of a debug build several
# times slower (1000 calendar rows: ~11 s). Only this package is optimised.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

# Android materializes its embedded web root from the shared library: every launch hashes the
# stored assets (sha2) and a first launch decompresses them (brotli). Unoptimised by the dev
# profile, a debug APK spent 43 s per warm launch and 63 s on the first one (Galaxy A23, 2026-10-26).
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.brotli]
opt-level = 3

[profile.dev.package.brotli-decompressor]
opt-level = 3

# Browser Bevy renderer. WebKit compiles it inside its separately limited
# WebContent process: the smallest generated code lowers both transfer and
# JavaScriptCore compilation pressure on iOS.
[profile.wasm-renderer]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Browser audio engine (Kira on a scheduled AudioContext).
[profile.wasm-audio]
inherits = "release"
opt-level = "s"
lto = true

# Its offline kernels run on whole sounds: speed first (measured, temp/step7_compute/).
[profile.wasm-audio.package.atome-audio-kernels]
opt-level = 3

# The direct path's AudioWorklet module: real-time code, speed first.
[profile.wasm-direct]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# iOS staticlib linked into the app and the AUv3 (platforms/ios/build_bevy_renderer.sh).
[profile.ios]
inherits = "release"
lto = "thin"
panic = "abort"
strip = "debuginfo"

# iOS native Rust debugging (ATOME_IOS_RUST_DEV=1).
[profile.ios-dev]
inherits = "dev"
debug = 0
panic = "abort"
strip = "debuginfo"
