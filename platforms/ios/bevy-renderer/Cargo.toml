[package]
name = "atome-ios-bevy-renderer"
version = "0.1.0"
edition = "2021"
description = "iOS C ABI boundary: the shared Atome Bevy renderer core and the native Kira audio engine"

[lib]
crate-type = ["staticlib"]

[dependencies]
atome-bevy-renderer-core = { path = "../../../atome/renderers/bevy-core" }
atome-audio-engine = { path = "../../../atome/engines/audio-engine" }
serde_json = "1"

[features]
# The native voice engine; build_bevy_renderer.sh enables it for the app on devices and
# provides libvosk_ios.a (build_vosk_ios.sh) through VOSK_IOS_LIB_DIR.
voice = ["atome-audio-engine/voice"]

[profile.dev]
debug = 0
panic = "abort"
strip = "debuginfo"

[profile.release]
lto = "thin"
panic = "abort"
strip = "debuginfo"
