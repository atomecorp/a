"$schema" = "schemas/schema.json"

[[set]]
identifier = "health-bridge"
description = "Allows the main webview to use the single gated health command. The command itself checks the per-page channel token, the verified account and the local association before any Health Connect read."
permissions = ["allow-health-invoke"]

[[permission]]
identifier = "allow-health-invoke"
description = "Enables the health_invoke command."
commands.allow = ["health_invoke"]
