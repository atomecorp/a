[env]
MACOSX_DEPLOYMENT_TARGET = "11.0"

# Android 64-bit releases must support 16 KB pages, including with the installed NDK r27.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384", "-C", "link-arg=-Wl,-z,common-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384", "-C", "link-arg=-Wl,-z,common-page-size=16384"]

# macOS: the app binary `tauri dev` runs is signed with the bundle's stable identity first
# (scripts/tauri_sign_and_run.sh), so the login keychain keeps trusting it across rebuilds.
[target.aarch64-apple-darwin]
runner = "../../scripts/tauri_sign_and_run.sh"

[target.x86_64-apple-darwin]
runner = "../../scripts/tauri_sign_and_run.sh"
