[package]
name = "squirrel"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# The Tauri CLI treats the binary named by `default-run` (or by the package
# name) as the main binary, so the `[[bin]] atome` target below has to be
# declared here as well.
default-run = "atome"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "squirrel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# macOS reads the application name from the executable whenever the app runs
# outside its bundle, which is the case in `tauri dev`: the binary name is the
# only visible identity owner on that lane, so it is `atome`. The crate and the
# library keep the `squirrel` names because `System.loadLibrary("squirrel_lib")`
# in the generated Android project and the installed application data depend on
# them.
[[bin]]
name = "atome"
path = "src/main.rs"

[features]
default = []

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { workspace = true, features = ["ws"] }
tokio = { workspace = true, features = ["full"] }
tower-http = { workspace = true, features = ["fs", "cors", "limit"] }
tauri.workspace = true
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-stt = { path = "vendor/tauri-plugin-stt" }
tauri-plugin-health = { path = "vendor/tauri-plugin-health" }
tauri-plugin-billing = { path = "vendor/tauri-plugin-billing" }
tauri-plugin-mobile-host = { path = "vendor/tauri-plugin-mobile-host" }
serde.workspace = true
serde_json.workspace = true
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
urlencoding = "2"
futures-util = "0.3"
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
base64.workspace = true
hound.workspace = true
# The audio engine (Kira, cpal, Symphonia) comes whole from atome-audio-engine.
atome-mix-graph = { path = "../../atome/engines/mix-graph" }
atome-audio-engine = { path = "../../atome/engines/audio-engine" }
once_cell.workspace = true
midir = "0.11"

# Local authentication and local sync storage. `src/server` uses these on every
# target, Android included: they are not macOS-only dependencies.
rusqlite.workspace = true
# The one Atome store (schema, commit, projection, history, ACL, type gate).
atome-store = { path = "../../atome/engines/atome-store" }
# The server behaviour shared with the Web server (CORS, request id, static roots).
atome-server = { path = "../../atome/servers/atome-server", default-features = false }
bcrypt = "0.15"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
rand = "0.8"
sha2.workspace = true
hex = "0.4"

# HTTP client for GitHub downloads.
# rustls instead of native-tls: native-tls pulls OpenSSL, which has no
# Android target here, and tokio-tungstenite already uses rustls.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }

# ZIP extraction for updates (GitHub archives are deflated; reading only).
zip = { version = "9.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile.workspace = true

# Environment variables from .env file
dotenvy = "0.15"

# The native voice engine (todo/refonte_assistant_vocal.md §4): libvosk comes from native/lib (desktop)
# and native/lib/android/<abi> (official vosk-android 0.3.75, packaged by gen/android/app/build.gradle.kts).
[target.'cfg(not(target_os = "ios"))'.dependencies]
atome-audio-engine = { path = "../../atome/engines/audio-engine", features = ["voice"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7.0", features = ["OSX_10_15"] }

# Reuse the JNI ABI already carried by the installed Android audio/runtime graph.
[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.21.1"

[lints]
workspace = true
