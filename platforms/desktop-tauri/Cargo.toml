[package]
name = "squirrel"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# The Tauri CLI treats the binary named by `default-run` (or by the package
# name) as the main binary, so the `[[bin]] atome` target below has to be
# declared here as well.
default-run = "atome"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "squirrel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# macOS reads the application name from the executable whenever the app runs
# outside its bundle, which is the case in `tauri dev`: the binary name is the
# only visible identity owner on that lane, so it is `atome`. The crate and the
# library keep the `squirrel` names because `System.loadLibrary("squirrel_lib")`
# in the generated Android project and the installed application data depend on
# them.
[[bin]]
name = "atome"
path = "src/main.rs"

[features]
default = []
bevy_backend = ["dep:bevy", "dep:atome-bevy-renderer-core"]
bevy_renderer_core = [
    "bevy_backend",
    "bevy/default_app",
    "bevy/bevy_window",
    "bevy/bevy_winit",
    "bevy/x11",
    "bevy/wayland",
    "bevy/bevy_render",
    "bevy/bevy_core_pipeline",
    "bevy/bevy_camera",
    "bevy/bevy_asset",
    "bevy/bevy_image",
    "bevy/bevy_sprite",
    "bevy/bevy_sprite_render",
    "bevy/bevy_ui",
    "bevy/bevy_ui_render",
    "bevy/png",
    "bevy/webgpu",
]
bevy_renderer_native = [
    "bevy_renderer_core",
    "bevy/multi_threaded",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bevy = { version = "0.19.0", default-features = false, optional = true }
atome-bevy-renderer-core = { path = "../../atome/renderers/bevy-core", optional = true }
axum = { version = "0.7.9", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5.0", features = ["fs", "cors", "limit"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-stt = { path = "vendor/tauri-plugin-stt" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
urlencoding = "2"
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
base64 = "0.22"
cpal = "0.15"
hound = "3"
kira = { version = "0.12", features = ["cpal", "wav", "mp3", "ogg", "flac", "aac", "isomp4"] }
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "isomp4"] }
ringbuf = "0.4"
once_cell = "1"
midir = "0.11"

# Local authentication and local sync storage. `src/server` uses these on every
# target, Android included: they are not macOS-only dependencies.
rusqlite = { version = "0.31", features = ["bundled"] }
bcrypt = "0.15"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"

# HTTP client for GitHub downloads.
# rustls instead of native-tls: native-tls pulls OpenSSL, which has no
# Android target here, and tokio-tungstenite already uses rustls.
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls-native-roots"] }

# ZIP extraction for updates
zip = "0.6"
tempfile = "3"

# Environment variables from .env file
dotenvy = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.5.1"
objc2 = "0.5.2"
objc2-foundation = { version = "0.2.2", features = ["NSArray", "NSEnumerator", "NSError", "NSObject", "NSString"] }
objc2-contacts = { version = "0.2.2", features = ["block2", "CNContact", "CNContactFetchRequest", "CNContactStore", "CNFetchRequest", "CNFetchResult", "CNLabeledValue", "CNPhoneNumber"] }
