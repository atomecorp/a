[package]
name = "tauri-plugin-billing"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
links = "tauri-plugin-billing"
description = "Google Play Billing bridge for the atome Android host. No JavaScript command: the app's gated `billing_invoke` is its only caller."
publish = false

[lib]
name = "tauri_plugin_billing"
path = "src/lib.rs"

[dependencies]
serde_json.workspace = true
tauri.workspace = true

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[lints]
workspace = true
