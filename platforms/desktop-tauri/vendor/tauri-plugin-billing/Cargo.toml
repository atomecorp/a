[package]
name = "tauri-plugin-billing"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-billing"
description = "Google Play Billing bridge for the atome Android host. No JavaScript command: the app's gated `billing_invoke` is its only caller."
publish = false

[lib]
name = "tauri_plugin_billing"
path = "src/lib.rs"

[dependencies]
serde_json = "1.0"
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
