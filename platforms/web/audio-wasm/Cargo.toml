[package]
name = "squirrel-audio-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The page's main-thread WASM module: the audio engine (Kira on a scheduled AudioContext), its offline kernels, the voice turns and the calendar engine"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "console",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContextOptions",
    "AudioDestinationNode",
    "AudioNode",
    "ChannelInterpretation",
    "AudioScheduledSourceNode",
    "BaseAudioContext",
    "AudioContext",
    "AudioWorklet",
    "MediaStream",
    "MediaStreamConstraints",
    "Navigator",
    "Window",
] }
kira = { workspace = true, features = ["wav", "pcm", "mp3", "ogg", "vorbis", "flac", "aac", "isomp4"] }
atome-mix-graph = { path = "../../../atome/engines/mix-graph", features = ["decode"] }
atome-voice-turns = { path = "../../../atome/engines/voice-turns" }
atome-audio-kernels = { path = "../../../atome/engines/audio-kernels" }
# The one calendar engine, for the page's agenda (src/calendar.rs).
atome-calendar = { path = "../../../atome/engines/atome-calendar" }
serde_json.workspace = true
hound.workspace = true
serde.workspace = true
serde-wasm-bindgen.workspace = true
once_cell.workspace = true

[lints]
workspace = true
