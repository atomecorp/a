[package]
name = "squirrel-audio-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM audio engine for Squirrel (Kira on a scheduled AudioContext)"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "=0.2.100"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContextOptions",
    "AudioDestinationNode",
    "AudioNode",
    "ChannelInterpretation",
    "AudioScheduledSourceNode",
    "BaseAudioContext",
    "AudioContext",
    "AudioWorklet",
    "MediaStream",
    "MediaStreamConstraints",
    "Navigator",
    "Window",
] }
kira = { version = "0.12", default-features = false, features = ["wav", "mp3", "ogg", "flac", "aac", "isomp4"] }
atome-mix-graph = { path = "../../../atome/engines/mix-graph" }
atome-voice-turns = { path = "../../../atome/engines/voice-turns" }
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "mp3", "ogg", "vorbis", "flac", "aac", "isomp4"] }
hound = "3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
once_cell = "1"

[profile.release]
opt-level = "s"
lto = true
