[package]
name = "squirrel-bevy-renderer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Unique Bevy WebGPU renderer surface for Atome/eVe web projection"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
atome-bevy-renderer-core = { path = "../../../atome/renderers/bevy-core" }
bevy = { workspace = true, features = [
    "bevy_window",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_camera",
    "bevy_asset",
    "bevy_image",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "webgpu",
] }
serde.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true

[lints]
workspace = true
