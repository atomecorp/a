# Planning default; builds resolve the official production release once unless pinned.
builder:
  version: 0.2.0
  freebsd: 15.1-RELEASE
  output_dir: temp/aos/output
  work_dir: temp/aos/work
  cache_dir: temp/aos/cache
  image_size_gib: 13
  evidence: recipe-only

targets:
  pc-amd64-uefi:
    family: pc
    arch: amd64
    base: vm-ufs
    boot: UEFI
    formats: [img, qcow2]
    default_format: img
    modes: [live, installer]
    note: UEFI external live boot or explicit internal installation via native bsdinstall; physical tests pending.
  pine64-a64:
    family: sbc
    arch: arm64
    base: PINE64
    boot: microSD ROM/SPL/U-Boot
    formats: [img]
    default_format: img
    modes: [live]
    note: PINE64 A64+ 2 GB A64-DB-V1.1; not PINE64-LTS, ROCK64 or ROCKPRO64.
  mac-vm-intel:
    family: vm
    arch: amd64
    base: vm-ufs
    boot: UEFI
    formats: [raw, qcow2, vmdk]
    default_format: qcow2
    modes: [live]
    note: Intel Mac guest; hypervisor and guest GPU/audio/USB require validation.
  mac-vm-apple-silicon:
    family: vm
    arch: arm64
    base: vm-ufs
    boot: UEFI
    formats: [raw, qcow2, vmdk]
    default_format: qcow2
    modes: [live]
    note: FreeBSD aarch64 guest; no claim of bare-metal Mac boot or accelerated graphics.
  arm64-uefi:
    family: firmware-uefi
    arch: arm64
    base: vm-ufs
    boot: UEFI
    formats: [img, qcow2]
    default_format: img
    modes: [live, installer]
    note: Candidate standard-firmware machines; each physical model needs validation.

modules:
  display:
    stacks: [webview]
    evidence: unverified
    note: Existing Cage/Cog route; real eVe requires WebGPU, not merely a browser window.
  audio:
    stacks: [audio]
    evidence: unverified
    note: OSS/JACK packages do not establish an atome native headless audio engine.
  midi:
    stacks: [midi]
    evidence: unverified
    note: USB MIDI driver plus existing Web MIDI/native contracts; FreeBSD runtime access unverified.
