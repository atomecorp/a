[package]
name = "atome-keychain-converter"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Standalone macOS utility: password-manager exports (1PUX, 1PIF, CSV) to the FIDO Credential Exchange Format 1.0, sealed by default"

[lib]
path = "src/lib.rs"

[[bin]]
name = "atome-keychain-converter"
path = "src/main.rs"

[[test]]
name = "keychain_converter"
path = "../../tests/keychain_converter/main.rs"

# Every crate below is already locked by the workspace (Tauri reads ZIPs with
# `zip`, atome-server seals with `ring` and derives with `argon2`).
[dependencies]
argon2 = "0.5"
base64.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std"] }
percent-encoding = "2"
ring = "0.17"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
url = "2"
zeroize = "1"
zip = { version = "9.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
