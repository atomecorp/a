<?xml version="1.0" encoding="UTF-8"?>
<!-- The glow of the eVe Dashboard Atom ring (atome_disc_ring.svg): the same pink
     to violet band, blurred, in the same 300 box. Its own picture, so that the
     open assistant can make it pulse (dashboard_eve_tokens.js `glow`); full
     strength here, the disc lays it at 0.75. -->
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
    <defs>
        <linearGradient id="atomeGlowStroke" x1="50" y1="250" x2="250" y2="50" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#ff2d95"/>
            <stop offset="0.55" stop-color="#d23cff" stop-opacity="0.9"/>
            <stop offset="1" stop-color="#7b3dff" stop-opacity="0.55"/>
        </linearGradient>
        <filter id="atomeGlowBlur" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="9"/>
        </filter>
    </defs>
    <path fill="url(#atomeGlowStroke)" fill-rule="evenodd" filter="url(#atomeGlowBlur)"
        d="M30 150a120 120 0 1 0 240 0a120 120 0 1 0 -240 0Z M44.9 148.6a106.5 106.5 0 1 0 213 0a106.5 106.5 0 1 0 -213 0Z"/>
</svg>
