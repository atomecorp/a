[package]
name = "atome-audio-engine"
version = "0.1.0"
edition = "2021"
description = "Native Kira audio engine shared by Tauri desktop and iOS: sample-accurate playback, recording, mixer graph host, live inputs, calibration"

[lib]
path = "src/lib.rs"

[dependencies]
atome-mix-graph = { path = "../mix-graph" }
kira = { version = "0.12", default-features = false, features = ["wav", "pcm", "mp3", "ogg", "vorbis", "flac", "aac", "isomp4"] }
cpal = "0.15"
hound = "3"
ringbuf = "0.4"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "isomp4"] }
vosk = { version = "0.3.1", optional = true }
ort = { version = "=2.0.0-rc.15", optional = true }
base64 = { version = "0.22", optional = true }
atome-voice-turns = { path = "../voice-turns", optional = true }

[features]
# The host links libvosk (desktop: platforms/desktop-tauri/native/lib; iOS: libvosk_ios.a).
voice = ["dep:vosk", "dep:ort", "dep:base64", "dep:atome-voice-turns"]

[dev-dependencies]
tempfile = "3"

# Windows: WASAPI exclusive output and capture on one thread (src/wasapi_duplex.rs);
# the same `windows` release cpal already builds on, so no new crate.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.54", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Variant", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem"] }
