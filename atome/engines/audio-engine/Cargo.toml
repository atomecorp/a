[package]
name = "atome-audio-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Native Kira audio engine shared by Tauri desktop and iOS: sample-accurate playback, recording, mixer graph host, live inputs, calibration"

[lib]
path = "src/lib.rs"

[dependencies]
atome-mix-graph = { path = "../mix-graph", features = ["decode", "proxy", "freeze"] }
# The one WAV codec: a take is written with the kernels' encoder (src/recorder_wav.rs).
atome-audio-kernels = { path = "../audio-kernels" }
kira = { workspace = true, features = ["wav", "pcm", "mp3", "ogg", "vorbis", "flac", "aac", "isomp4"] }
cpal.workspace = true
hound.workspace = true
ringbuf.workspace = true
once_cell.workspace = true
serde.workspace = true
serde_json.workspace = true
vosk = { version = "0.3.1", optional = true }
ort = { version = "=2.0.0-rc.15", optional = true }
# A proxy comes back in base64 (src/render_proxy.rs), as the voice session's audio.
base64.workspace = true
atome-voice-turns = { path = "../voice-turns", optional = true }

[features]
# The host links libvosk (desktop: platforms/desktop-tauri/native/lib; iOS: libvosk_ios.a).
voice = ["dep:vosk", "dep:ort", "dep:atome-voice-turns"]
# Windows: ASIO drivers beside WASAPI exclusive (src/asio_duplex.rs). cpal's ASIO host builds
# asio-sys against the Steinberg ASIO SDK (CPAL_ASIO_DIR, else fetched by its build script) and
# needs LLVM's libclang; the Windows desktop build enables it.
asio = ["cpal/asio"]

[dev-dependencies]
tempfile.workspace = true

# Windows: WASAPI exclusive output and capture on one thread (src/wasapi_duplex.rs);
# the same `windows` release cpal already builds on, so no new crate.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.54", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Variant", "Win32_Devices_FunctionDiscovery", "Win32_Devices_Properties", "Win32_Security", "Win32_UI_Shell_PropertiesSystem"] }

[lints]
workspace = true
