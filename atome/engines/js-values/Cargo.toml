[package]
name = "atome-js-values"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The JavaScript readings of a JSON value the ports from JS keep (truthiness, String(), Number(), new Date()) and the one owner of the clock and of the date texts written and read (chrono's former formats, byte for byte), shared by atome-server, atome-store, atome-vault, atome-calendar, squirrel and the keychain converter"

[dependencies]
serde_json.workspace = true

# The clock and the host's time zone (`TZ`, else the system's tzdb).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jiff = "0.2.37"

# In the browser the clock is the browser's own, and a local wall time is read by its Date.
[target.'cfg(target_arch = "wasm32")'.dependencies]
jiff = { version = "0.2.37", default-features = false, features = ["std", "js"] }
js-sys.workspace = true

[[test]]
name = "date_formats"
path = "../../../tests/atome_js_values/date_formats.rs"

[lints]
workspace = true
