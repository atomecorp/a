[package]
name = "atome-screen-cast"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Named screens of the local network (R-248): a Chromecast (Cast v2) and an Apple TV (AirPlay, HAP pairing) found by Bonjour, a media sent to one by its name"

[lib]
path = "src/lib.rs"

[dependencies]
# The MP4 boxes of the live HLS stream (src/hls/mp4.rs): the one box writer.
atome-mp4 = { path = "../mp4" }
tokio = { workspace = true, features = ["net", "io-util", "time", "sync", "rt", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { version = "0.10" }
num-bigint = "0.4"
plist = "1.10"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"

[target.'cfg(not(target_os = "ios"))'.dependencies]
mdns-sd = "0.13"

# The sound of a live stream in AAC (src/hls/aac.rs): the device's own encoder, the crates cpal already builds on.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-audio-toolbox = { version = "0.3", default-features = false, features = ["std", "AudioConverter", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
