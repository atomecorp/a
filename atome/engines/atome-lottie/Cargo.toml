[package]
name = "atome-lottie"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Lottie animations (bodymovin .json, dotLottie .lottie) read, inspected and timed for the Bevy renderer"

[lib]
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
# Lottie -> vector model (Apache-2.0 OR MIT). Its `vello` feature lets the renderer encode a frame
# into the vello Scene drawn on Bevy's own wgpu device (atome/renderers/bevy-core/src/lottie_gpu.rs).
velato = { version = "0.12.0", default-features = false, features = ["vello"] }
# A dotLottie is a zip, read entry by entry (never extracted); 9.x carries the RUSTSEC-2026-0367/0368/0369/0429 fixes.
zip = { version = "9.3", default-features = false, features = ["deflate"] }

[lints]
workspace = true
