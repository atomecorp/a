[package]
name = "atome-dsp"
version = "0.1.0"
edition = "2021"
description = "eVe real-time DSP bricks: one processor contract shared by the native direct path, the Kira mixer graph and the Web AudioWorklet"

[lib]
path = "src/lib.rs"

[dependencies]
nam-rs = "0.4"
fft-convolver = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
