[package]
name = "atome-instrument"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "eVe instruments: note events, voice allocation and the sampler, played through the atome-dsp processor contract"

[lib]
path = "src/lib.rs"

[dependencies]
atome-dsp = { path = "../atome-dsp" }
# The stretcher's FFT (stretch/stft.rs; Signalsmith Stretch ported to Rust, Q2 measured in temp/synth/stretch_probe).
rustfft = "6"

[lints]
workspace = true
