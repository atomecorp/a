[package]
name = "atome-instrument"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "eVe instruments: note events, voice allocation and the sampler, played through the atome-dsp processor contract"

[lib]
path = "src/lib.rs"

[dependencies]
atome-dsp = { path = "../atome-dsp" }

# Real-time stretch (Q2, measured against Rubber Band: temp/synth/stretch_probe).
# Its C++ core does not build for wasm32: there a stretched segment is refused.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
signalsmith-stretch = "0.1.3"

[lints]
workspace = true
