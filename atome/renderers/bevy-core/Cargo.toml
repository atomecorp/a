[package]
name = "atome-bevy-renderer-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Shared Bevy renderer core for Atome projections"

[dependencies]
bevy = { workspace = true, features = [
    "bevy_window",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_camera",
    "bevy_asset",
    "bevy_image",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "webgpu",
] }
serde.workspace = true
serde_bytes = "0.11"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[dev-dependencies]
# Les tests de RETRAIT verifient la deserialisation : il faut donc un
# vrai format pour distinguer une cle absente d'une cle a `null`.
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["HtmlMediaElement", "HtmlVideoElement", "ImageBitmap", "VideoFrame", "Window"] }
wgpu = { workspace = true, features = ["webgpu"] }

[lints]
workspace = true
